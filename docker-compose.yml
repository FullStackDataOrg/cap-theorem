version: "3.8"

# Project 03 — CAP Theorem
# Two independent PostgreSQL nodes. No replication configured — intentional.
# The absence of replication is what makes the divergence visible.
#
# Start:   docker compose up postgres_node1 postgres_node2 -d
# Stop:    docker compose down
# Reset:   docker compose down -v  (removes volumes — full clean slate)

services:

  postgres_node1:
    image: postgres:15
    container_name: postgres_node1
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: engineer
      POSTGRES_PASSWORD: engineer
    ports:
      - "5432:5432"
    volumes:
      - pg_node1_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engineer -d payments"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres_node2:
    image: postgres:15
    container_name: postgres_node2
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: engineer
      POSTGRES_PASSWORD: engineer
    ports:
      - "5433:5432"
    volumes:
      - pg_node2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engineer -d payments"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_node1_data:
  pg_node2_data: